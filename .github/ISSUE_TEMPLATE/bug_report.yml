name: Bug Report
description: Report a bug, UI issue, or inaccurate Stardew Valley 1.6 data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can this issue be reproduced?
      placeholder: |
        1. Open '...'
        2. Select '...'
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Platform / Hosting Environment
      options:
        - iPadOS Safari (Home Screen PWA)
        - iPadOS Safari (Browser tab)
        - Desktop Browser (Local dev / Vite)
        - Local LAN Host (`npm run host`)
        - Docker / Nginx
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context or Screenshots
      description: Include browser version, console errors, or screenshots if applicable.
